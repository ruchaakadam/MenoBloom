<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | MenoBloom</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(
                135deg,
                #fff7fa,
                #fff0f6
            );

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            color: #333;
        }

        .container {
            width: 100%;
            max-width: 470px;
            padding: 30px;
        }

        .brand {
            text-align: center;
            margin-bottom: 30px;
        }

        .brand h1 {
            color: #bd5b88;
            font-size: 38px;
            font-weight: 700;
        }

        .brand span {
            font-size: 40px;
        }

        .login-card {
            background: white;

            padding: 45px;

            border-radius: 25px;

            box-shadow:
                0 15px 40px rgba(189, 91, 136, 0.12);
        }

        .login-card h2 {
            text-align: center;

            font-size: 32px;

            margin-bottom: 10px;

            color: #333;
        }

        .subtitle {
            text-align: center;

            color: #777;

            font-size: 17px;

            margin-bottom: 30px;
        }

        .error {
            background: #fff0f0;

            color: #c0392b;

            border: 1px solid #f5c6c6;

            padding: 12px 15px;

            border-radius: 10px;

            margin-bottom: 20px;

            font-size: 14px;
        }

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;

            font-size: 16px;

            font-weight: 600;

            margin-bottom: 8px;

            color: #444;
        }

        input {
            width: 100%;

            padding: 15px 16px;

            border: 1px solid #e5c9d7;

            border-radius: 12px;

            font-size: 16px;

            outline: none;

            transition: 0.2s;
        }

        input:focus {
            border-color: #bd5b88;

            box-shadow:
                0 0 0 3px rgba(189, 91, 136, 0.12);
        }

        input::placeholder {
            color: #aaa;
        }

        .login-button {
            width: 100%;

            border: none;

            padding: 15px;

            border-radius: 12px;

            background: #bd5b88;

            color: white;

            font-size: 17px;

            font-weight: 600;

            cursor: pointer;

            margin-top: 5px;

            transition: 0.2s;
        }

        .login-button:hover {
            background: #a94c77;

            transform: translateY(-1px);
        }

        .signup-text {
            text-align: center;

            margin-top: 25px;

            color: #777;

            font-size: 15px;
        }

        .signup-text a {
            color: #bd5b88;

            font-weight: 600;

            text-decoration: none;
        }

        .signup-text a:hover {
            text-decoration: underline;
        }

    </style>
</head>

<body>

<div class="container">

    <!-- BRAND -->

    <div class="brand">

        <h1>
            <span>🌸</span>
            MenoBloom!
        </h1>

    </div>


    <!-- LOGIN CARD -->

    <div class="login-card">

        <h2>
            Welcome Back
        </h2>

        <p class="subtitle">
            Login to continue your wellness journey.
        </p>


        <!-- ERROR MESSAGE -->

        {% if error %}

            <div class="error">
                {{ error }}
            </div>

        {% endif %}


        <!-- LOGIN FORM -->

        <form method="POST" action="{% url 'login' %}">

            {% csrf_token %}


            <!-- USERNAME -->

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    required
                    autocomplete="username"
                >

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                    autocomplete="current-password"
                >

            </div>


            <!-- LOGIN BUTTON -->

            <button
                type="submit"
                class="login-button"
            >
                Login
            </button>

        </form>


        <!-- SIGNUP -->

        <div class="signup-text">

            Don't have an account?

            <a href="{% url 'signup' %}">
                Create one
            </a>

        </div>

    </div>

</div>

</body>
</html>
