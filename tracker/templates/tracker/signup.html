<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sign Up | HerBalance</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {

            min-height: 100vh;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #fff4f8,
                    #fffafd
                );

            display: flex;

            align-items: center;

            justify-content: center;

            color: #333;
        }


        .container {

            width: 90%;

            max-width: 470px;
        }


        .logo {

            text-align: center;

            font-size: 32px;

            font-weight: 700;

            color: #b95783;

            margin-bottom: 25px;
        }


        .card {

            background: white;

            padding: 40px;

            border-radius: 25px;

            box-shadow:
                0 12px 40px
                rgba(185, 87, 131, 0.12);
        }


        h1 {

            text-align: center;

            font-size: 28px;

            margin-bottom: 8px;
        }


        .subtitle {

            text-align: center;

            color: #777;

            margin-bottom: 25px;
        }


        .error {

            background: #fff0f0;

            color: #a33;

            padding: 12px;

            border-radius: 10px;

            margin-bottom: 18px;

            font-size: 14px;
        }


        label {

            display: block;

            font-weight: 600;

            margin-top: 16px;

            margin-bottom: 7px;
        }


        input {

            width: 100%;

            padding: 13px 14px;

            border:
                1px solid #e5d5dd;

            border-radius: 10px;

            font-size: 15px;

            outline: none;
        }


        input:focus {

            border-color: #b95783;

            box-shadow:
                0 0 0 3px
                rgba(185, 87, 131, 0.10);
        }


        button {

            width: 100%;

            border: none;

            padding: 14px;

            margin-top: 25px;

            border-radius: 11px;

            background: #b95783;

            color: white;

            font-size: 16px;

            font-weight: 700;

            cursor: pointer;
        }


        button:hover {

            opacity: 0.9;
        }


        .login {

            text-align: center;

            margin-top: 22px;

            color: #777;

            font-size: 14px;
        }


        .login a {

            color: #b95783;

            font-weight: 700;

            text-decoration: none;
        }

    </style>

</head>


<body>


<div class="container">


    <div class="logo">
        🌸 HerBalance
    </div>


    <div class="card">

        <h1>
            Create Your Account
        </h1>


        <p class="subtitle">
            Start your personalized HerBalance journey.
        </p>


        {% if error %}

            <div class="error">
                {{ error }}
            </div>

        {% endif %}


        <form method="POST">

            {% csrf_token %}


            <label for="username">
                Username
            </label>

            <input
                type="text"
                id="username"
                name="username"
                placeholder="Choose a username"
                required
            >


            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >


            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Create a password"
                required
            >


            <label for="confirm_password">
                Confirm Password
            </label>

            <input
                type="password"
                id="confirm_password"
                name="confirm_password"
                placeholder="Re-enter your password"
                required
            >


            <button type="submit">
                Create Account
            </button>

        </form>


        <div class="login">

            Already have an account?

            <a href="{% url 'login' %}">
                Login
            </a>

        </div>

    </div>

</div>


</body>

</html>
