services:
  - type: web
    name: menobloom
    runtime: python
    plan: free

    buildCommand: "./build.sh"

    startCommand: "gunicorn config.wsgi:application"

    envVars:
      - key: SECRET_KEY
        generateValue: true

      - key: DEBUG
        value: "False"

      - key: DATABASE_URL
        fromDatabase:
          name: menobloom-db
          property: connectionString

databases:
  - name: menobloom-db
    plan: free