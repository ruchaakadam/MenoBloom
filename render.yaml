services:
  - type: web
    name: menobloom
    runtime: python

    buildCommand: "./build.sh"

    startCommand: "gunicorn config.wsgi:application"

    envVars:

      - key: SECRET_KEY
        generateValue: true

      - key: DEBUG
        value: "False"

      - key: DATABASE_URL
        fromDatabase:
          name: menobloom-db
          property: connectionString


databases:

  - name: menobloom-db